[project]
name = "inchand-ai-v2"
version = "0.1.0"
description = "Inchand AI V2 — LLM-first intent and reply flow"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
dashboard = [
    "streamlit>=1.28",
    "pandas>=2.0",
]
# Install dashboard deps without editable package:
#   pip install streamlit pandas
# or from repo root:
#   pip install '.[dashboard]'

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
